version: '3.9'
services:
  dashboard:
    build: .
    restart: unless-stopped
    ports: ['5000:5000']
    env_file: .env
    networks: [app-network]
    healthcheck:
      test: ['CMD','curl','-f','http://localhost:5000/health']
      interval: 30s
      timeout: 10s
      retries: 3
networks:
  app-network:
    driver: bridge
